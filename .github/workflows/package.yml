name: Build and Zip UI

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'pipeline/**'
  pull_request:
    branches:
      - 'pipeline/**'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom tag for the build (e.g., v1.0.0-custom)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'  # Updated to 20.x as per your version

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build:react  # Creates 'build' folder

      - name: Determine Artifact Tag
        id: set_tag
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            # Use custom tag from manual input, sanitize it
            TAG=$(echo "${{ github.event.inputs.custom_tag }}" | tr '/' '-')
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Use tag from push event
            TAG="${GITHUB_REF##*/}"
          else
            # Generate a sanitized tag for branches/PRs
            REF_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
            TAG="v0.0.0-${REF_NAME}-$(date +%s)"
          fi
          echo "Using tag: $TAG"
          echo "artifact_tag=$TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Zip Build Output
        run: |
          zip -r wsp-desktop-ui-build.zip build/
        working-directory: .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsp-desktop-ui-build-${{ steps.set_tag.outputs.artifact_tag }}  # Use sanitized tag
          path: wsp-desktop-ui-build.zip
          retention-days: 30  # Keep artifact for 30 days (adjust as needed)